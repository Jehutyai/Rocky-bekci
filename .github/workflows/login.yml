name: roborock-giris

on:
  workflow_dispatch:
    inputs:
      kod:
        description: "E-postana gelen kod (ILK calistirmada BOS birak)"
        required: false
        default: ""

jobs:
  giris:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python login.py
        env:
          RR_EMAIL: ${{ secrets.RR_EMAIL }}
          RR_CODE: ${{ github.event.inputs.kod }}
