name: rocky-bekci

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

concurrency:
  group: rocky
  cancel-in-progress: false

jobs:
  kontrol:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python monitor.py
        env:
          RR_EMAIL: ${{ secrets.RR_EMAIL }}
          RR_USER_DATA: ${{ secrets.RR_USER_DATA }}
          BATTERY_THRESHOLD: "97"
          RESUME_THRESHOLD: "100"
