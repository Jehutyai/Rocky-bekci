name: rocky-bekci

on:
  schedule:
    - cron: "3,13,23,33,43,53 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: rocky
  cancel-in-progress: false

jobs:
  kontrol:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python monitor.py
        env:
          RR_EMAIL: ${{ secrets.RR_EMAIL }}
          RR_USER_DATA: ${{ secrets.RR_USER_DATA }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          BATTERY_THRESHOLD: "45"
          RESCUE_THRESHOLD: "30"
          RESUME_THRESHOLD: "100"
          RESUME_REPEAT: "2"
          COVERAGE_THRESHOLD: "60"
          POINT_THRESHOLD: "100"
