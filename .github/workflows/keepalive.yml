name: uyutma-engeli

on:
  schedule:
    - cron: "0 3 1,15 * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  nabiz:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: |
          date > .nabiz
          git config user.name "rocky-bekci"
          git config user.email "actions@github.com"
          git add .nabiz
          git commit -m "nabiz" || echo "degisiklik yok"
          git push
